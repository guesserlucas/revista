<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Consolidada</title>
    
    <!-- CSS Embutido -->
    <style>
        :root {
            --primary-color: #007BFF;
            --bg-color: #f4f4f9;
            --text-color: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }

        p {
            margin-bottom: 1.5rem;
            line-height: 1.5;
            color: #666;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        #mensagem {
            margin-top: 15px;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>

    <!-- Estrutura HTML -->
    <div class="container">
        <h1>Bem-vindo!</h1>
        <p>Este é um exemplo de arquivo HTML com CSS e JavaScript no mesmo documento.</p>
        <button id="meuBotao">Clique em mim</button>
        <p id="mensagem"></p>
    </div>

    <!-- JavaScript Embutido -->
    <script>
        // Selecionando os elementos
        const botao = document.getElementById('meuBotao');
        const mensagem = document.getElementById('mensagem');

        // Adicionando evento de clique
        botao.addEventListener('click', function() {
            mensagem.textContent = "Ação realizada com sucesso! O JavaScript está funcionando.";
            botao.style.display = 'none'; // Esconde o botão após o clique
        });
    </script>

</body>
</html>
